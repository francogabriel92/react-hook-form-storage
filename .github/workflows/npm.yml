name: Publish to NPM

# The version in package.json is the single source of truth: bump it in a normal
# PR alongside its CHANGELOG entry, then dispatch this workflow. It publishes
# exactly the committed version and tags it — it never bumps, so there is no way
# for the published version to disagree with the committed one.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Publishing is only ever valid from the default branch. workflow_dispatch can
    # be triggered from any ref, and without this guard that would bump, tag and
    # publish whatever happened to be on that branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Read the version to publish
        id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Refuse to republish an existing version
        run: |
          VERSION='${{ steps.version.outputs.value }}'
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Bump the version in package.json first."
            exit 1
          fi
          if npm view "react-hook-form-storage@$VERSION" version >/dev/null 2>&1; then
            echo "react-hook-form-storage@$VERSION is already on npm."
            exit 1
          fi

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the published version
        # Only after a successful publish, so a failed release leaves no tag.
        run: |
          VERSION='${{ steps.version.outputs.value }}'
          git tag -a "v$VERSION" -m "release: v$VERSION"
          git push origin "v$VERSION"